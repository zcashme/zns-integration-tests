# Lint on zvs; PR e2e on the author's Mac; main-gate e2e on zvs.
#
# The PR claim job is actor-routed (label mac-<login>): your commit builds
# on your machine, with its local zebrad / zns-mint checkout / params. A
# sleeping Mac queues the job until the runner reconnects (24h cap).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test
    runs-on: [self-hosted, zvs]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zns-integration-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: zns-integration-tests

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zns-integration-tests

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test (lib)
        run: cargo test --lib

  # PR e2e on the author's machine: fast, warm, no downloads.
  claim:
    name: claim (${{ github.actor }})
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, "mac-${{ github.actor }}"]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zns-integration-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: zns-integration-tests

      # The author's machine brings its own toolchain; provisioning actions
      # would mutate it. Just make the local cargo reachable.
      - name: cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Point at the local stack
        run: |
          echo "ZEBRAD_BIN=$HOME/.cargo/bin/zebrad" >> "$GITHUB_ENV"
          echo "ZNS_MINT_DIR=$HOME/ZcashNames/zns-mint" >> "$GITHUB_ENV"

      - name: claim
        run: cargo test --test claim -- --nocapture

  # Authoritative e2e on the always-on box: hermetic (fresh mint checkout,
  # pinned zebrad release, fetched Sapling params).
  claim-main:
    name: claim (zvs)
    if: github.event_name == 'push'
    runs-on: [self-hosted, zvs]
    timeout-minutes: 90
    env:
      ZEBRAD_VERSION: "6.3.0"
    defaults:
      run:
        working-directory: zns-integration-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: zns-integration-tests

      - name: Checkout zns-mint
        uses: actions/checkout@v4
        with:
          repository: zcashme/zns-mint
          path: zns-mint

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zns-integration-tests
            zns-mint

      - name: Install zebrad
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          asset="zebrad-${ZEBRAD_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/ZcashFoundation/zebra/releases/download/v${ZEBRAD_VERSION}"
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}"
          bin="$(find . -maxdepth 3 -type f -name zebrad | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          echo "ZEBRAD_BIN=${GITHUB_WORKSPACE}/${bin#./}" >> "$GITHUB_ENV"

      - name: Cache Sapling params
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/zcash-params
          key: sapling-params-spend-47958396-output-3592860

      - name: Fetch Sapling params
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p zcash-params
          base="https://download.z.cash/downloads"
          spend="zcash-params/sapling-spend.params"
          output="zcash-params/sapling-output.params"
          if [[ ! -f "$spend" || "$(stat -c%s "$spend")" -ne 47958396 ]]; then
            curl -L --fail -o "$spend" "${base}/sapling-spend.params"
          fi
          if [[ ! -f "$output" || "$(stat -c%s "$output")" -ne 3592860 ]]; then
            curl -L --fail -o "$output" "${base}/sapling-output.params"
          fi
          test "$(stat -c%s "$spend")" -eq 47958396
          test "$(stat -c%s "$output")" -eq 3592860

      - name: claim
        env:
          ZNS_MINT_DIR: ${{ github.workspace }}/zns-mint
          ZCASH_PARAMS_DIR: ${{ github.workspace }}/zcash-params
        run: cargo test --test claim -- --nocapture
